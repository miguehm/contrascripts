<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>fountain + vite</title>
    <style>
      body {
        margin: 0;
        padding: 2rem;
        background: #14161a;
        color: #e6e8ec;
        font: 14px/1.5 system-ui, sans-serif;
      }
      h1 { font-size: 15px; margin: 0 0 0.5rem; }
      #status { color: #8b93a1; font-size: 12px; margin-bottom: 1rem; }
      #status.error { color: #e06c6c; }
      textarea {
        width: 100%;
        height: 12rem;
        padding: 12px;
        background: #1c1f26;
        color: inherit;
        border: 1px solid #2c313b;
        border-radius: 6px;
        font: 13px/1.6 ui-monospace, Menlo, monospace;
        resize: vertical;
      }
      button {
        font: inherit;
        font-size: 12px;
        margin-top: 12px;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid #2c313b;
        background: #262b34;
        color: inherit;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: progress; }
      ul { font-size: 12px; color: #e0a458; padding-left: 20px; }
      code { color: #8b93a1; }
      #count { color: #8b93a1; font-size: 12px; margin-top: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
