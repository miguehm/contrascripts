<!doctype html>
<!--
  Live preview for the Fountain wasm modules.

  This is a plain ES module page: no build step, no framework, no dependencies.
  It is the intended shape of a consumer, and it doubles as the manual check
  that the documented usage actually works.

  The right pane is the renderer's own output, rendered in place: each edit
  calls renderPDF and points an <iframe> at the resulting blob. It is not the
  document re-laid-out in HTML, which is what this page used to do and what made
  it drift away from the PDF — see the note by #preview.

  Serve the repository root (`make smoke` starts a server on :4173, or
  `cd web && npm run serve`) and open /web/.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fountain — live preview</title>
    <style>
      :root {
        --bg: #14161a;
        --panel: #1c1f26;
        --line: #2c313b;
        --text: #e6e8ec;
        --muted: #8b93a1;
        --accent: #6ea8fe;
        --warn: #e0a458;
        --page: #f7f5f0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      header h1 { font-size: 14px; font-weight: 600; margin: 0; }
      #status { color: var(--muted); font-size: 12px; margin-left: auto; }
      #status.error { color: #e06c6c; }
      button {
        font: inherit;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: #262b34;
        color: var(--text);
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: progress; }
      main { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
      #source {
        width: 100%;
        height: 100%;
        padding: 16px;
        border: 0;
        border-right: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        font: 13px/1.6 ui-monospace, "Cascadia Code", Menlo, monospace;
        resize: none;
        outline: none;
        tab-size: 2;
      }
      #output { display: grid; grid-template-rows: 1fr auto; min-height: 0; }

      /* The preview is the PDF the renderer produces, shown in place, rather
         than the document re-laid-out in CSS. Those were two separate layout
         engines fed by one parser, and they drifted: every column, gap and
         uppercase here was a hand copy of a constant in internal/renderer, and
         a copy nobody checks is a copy that rots. It also could not have been
         made faithful, because the renderer's real work is keep-together
         (keepWithNext), block splitting (splitPoint) and 60-character wrapping,
         none of which CSS expresses. Same renderer means 1:1 by construction. */
      #preview { width: 100%; height: 100%; border: 0; background: var(--page); }

      #warnings { padding: 12px 24px 16px; font: 12px/1.5 system-ui, sans-serif; }
      #warnings li { color: var(--warn); }
      #warnings code { color: var(--muted); }
      #warnings ul { margin: 6px 0; padding-left: 20px; }
    </style>
  </head>
  <body>
    <header>
      <h1>fountain — live preview</h1>
      <button id="pdf" disabled>Download PDF</button>
      <span id="status">booting…</span>
    </header>

    <main>
      <textarea id="source" spellcheck="false">Title: LA SEÑAL
Credit: Written by
Author: Jane Doe

EXT. SPACE - NIGHT

Stars fill the void. A **lone** satellite orbits a distant planet.

ELENA
(whispered)
Come on, come on...

CUT TO:

INT. SPACE STATION - CONTROL ROOM - NIGHT

A bank of monitors flickers. ELENA stares at a blinking cursor.

STATIC
Any signal yet?

ELENA
Nothing. Six months of silence and today's no different.
</textarea>
      <div id="output">
        <iframe id="preview" title="Rendered screenplay"></iframe>
        <div id="warnings"></div>
      </div>
    </main>

    <script type="module">
      import { createFountain } from '../dist/fountain.mjs'

      const source = document.getElementById('source')
      const frame = document.getElementById('preview')
      const warnings = document.getElementById('warnings')
      const status = document.getElementById('status')
      const pdfButton = document.getElementById('pdf')

      const esc = (s) =>
        s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])

      function renderWarnings(list) {
        if (!list?.length) {
          warnings.innerHTML = ''
          return
        }
        const items = list
          .map((w) => `<li>line ${w.line} — <code>${w.code}</code> ${esc(w.message)}</li>`)
          .join('')
        warnings.innerHTML = `<ul>${items}</ul>`
      }

      const fountain = await createFountain()

      // The blob URL the iframe is currently showing, and the bytes behind it.
      // The bytes are kept separately because the download has to survive a
      // render replacing the URL out from under the click.
      let viewUrl = null
      let bytes = null

      // Counts renders. renderPDF is async, so two can be in flight at once and
      // the slower one can resolve last; without this an older render would
      // land on top of a newer one and the preview would go stale.
      let generation = 0

      // The render the PDF preview waits out before firing.
      let timer = 0

      async function draw(text) {
        const gen = ++generation
        status.textContent = 'rendering…'
        status.classList.remove('error')
        try {
          const rendered = await fountain.renderPDF(text)
          // A newer render already claimed the preview, so this one is stale.
          if (gen !== generation) return

          bytes = rendered
          const url = URL.createObjectURL(new Blob([rendered], { type: 'application/pdf' }))
          frame.src = url
          // Revoked after the swap, never before: releasing the old URL first
          // would leave the iframe pointing at a dead blob for a frame.
          if (viewUrl) URL.revokeObjectURL(viewUrl)
          viewUrl = url

          // The download hands over the bytes the preview is already showing,
          // so it stays disabled until there are some to hand.
          pdfButton.disabled = false
          status.textContent = 'ready'
        } catch (err) {
          if (gen !== generation) return
          status.textContent = String(err?.message ?? err)
          status.classList.add('error')
        }
      }

      // lint is synchronous and costs ~2ms, so the warnings follow the
      // keystroke. The PDF is ~100ms, so it waits for a pause instead.
      function update() {
        try {
          renderWarnings(fountain.lint(source.value))
        } catch (err) {
          status.textContent = String(err?.message ?? err)
          status.classList.add('error')
        }
        clearTimeout(timer)
        timer = setTimeout(() => draw(source.value), 200)
      }

      source.addEventListener('input', update)

      pdfButton.addEventListener('click', () => {
        if (!bytes) return
        const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }))
        const a = document.createElement('a')
        a.href = url
        a.download = 'script.pdf'
        a.click()
        URL.revokeObjectURL(url)
      })

      // First render without the debounce: the page should not sit blank for
      // 200ms on load, and this pulls the 6.7MB module in right away.
      draw(source.value)
    </script>
  </body>
</html>
